spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
spring.flyway.enabled=true
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
# Иначе один зависший Redis-клиент блокирует единственный поток @Scheduled и AI-проверка не стартует.
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:5s}
# Несколько потоков: outbox, ai-check, chat-cleanup не мешают друг другу.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
spring.mail.host=${SPRING_MAIL_HOST:mailhog}
spring.mail.port=${SPRING_MAIL_PORT:1025}
gigachat.base-url=${GIGACHAT_BASE_URL:https://gigachat.devices.sberbank.ru/api/v1}
gigachat.model=${GIGACHAT_MODEL:GigaChat}
gigachat.token=${GIGACHAT_TOKEN:MDE5OWM1MTktMjVjYy03ODhmLTg0OTctZjAzMjQ2OTYwMjhhOjQ4ODk2MTBjLWZlZjgtNDVjMi1hNDZhLWNiYjUyMDBlMGExMA==}
platform.redis.enabled=true
platform.jwt.secret=${PLATFORM_JWT_SECRET:platform-docker-jwt-secret-change-me-32b!!}
platform.files.base-dir=${PLATFORM_FILES_BASE_DIR:/app/storage}
platform.aicheck.worker.delay-ms=${PLATFORM_AICHECK_WORKER_DELAY_MS:3000}
platform.aicheck.gigachat.enabled=${PLATFORM_AICHECK_GIGACHAT_ENABLED:true}
platform.aicheck.gigachat.insecure-ssl=${PLATFORM_AICHECK_GIGACHAT_INSECURE_SSL:true}
platform.aicheck.deepseek.enabled=${PLATFORM_AICHECK_DEEPSEEK_ENABLED:true}
platform.aicheck.deepseek.base-url=${PLATFORM_AICHECK_DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
platform.aicheck.deepseek.model=${PLATFORM_AICHECK_DEEPSEEK_MODEL:deepseek-chat}
platform.aicheck.deepseek.token=${PLATFORM_AICHECK_DEEPSEEK_TOKEN:sk-e3081aff8eb74dd9bd6f2533ecd21894}
platform.aicheck.deepseek.skip-for-ai-check=${PLATFORM_AICHECK_DEEPSEEK_SKIP_FOR_AICHECK:true}
platform.aicheck.qwen.enabled=${PLATFORM_AICHECK_QWEN_ENABLED:false}
platform.aicheck.qwen.base-url=${PLATFORM_AICHECK_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
platform.aicheck.qwen.model=${PLATFORM_AICHECK_QWEN_MODEL:qwen-plus}
platform.aicheck.qwen.token=${PLATFORM_AICHECK_QWEN_TOKEN:}
platform.aicheck.archive.max-size-bytes=${PLATFORM_AICHECK_ARCHIVE_MAX_SIZE_BYTES:50000000}
platform.aicheck.archive.max-files=${PLATFORM_AICHECK_ARCHIVE_MAX_FILES:1500}
platform.aicheck.work-dir=${PLATFORM_AICHECK_WORK_DIR:/app/storage/aicheck-work}
platform.aicheck.docker.cpus=${PLATFORM_AICHECK_DOCKER_CPUS:2}
platform.aicheck.docker.memory=${PLATFORM_AICHECK_DOCKER_MEMORY:1g}
platform.aicheck.runner.url=${PLATFORM_AICHECK_RUNNER_URL:}
platform.aicheck.runner.secret=${PLATFORM_AICHECK_RUNNER_SECRET:}
platform.aicheck.runner.max-archive-bytes=${PLATFORM_AICHECK_RUNNER_MAX_ARCHIVE_BYTES:52428800}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
# Пустые значения: при старте ключи создаются в {platform.files.base-dir}/.registration-invite-secrets.json (volume storage_data).
platform.registration.teacher-secret=${PLATFORM_REGISTRATION_TEACHER_SECRET:}
platform.registration.admin-secret=${PLATFORM_REGISTRATION_ADMIN_SECRET:}
